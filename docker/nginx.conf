# Front door on port 8888: everything goes to the active backend (llama-server
# or vLLM on 127.0.0.1:8080, including llama.cpp's chat UI and SSE streaming),
# except /monitor/ (Inference Overdrive dashboard), /monitor/hw (hw-metrics
# sidecar), /server/ (control page) and /server/api/ (server manager).

worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;

    # Image uploads for the mmproj (vision) path.
    client_max_body_size 100m;

    # the LLM backend the server manager runs (llama-server or vllm serve)
    upstream llm {
        server 127.0.0.1:8080;
        keepalive 16;
    }

    server {
        listen 8888;
        # Host port may differ from 8888 (LLM_PORT), so keep redirects relative.
        absolute_redirect off;

        # Port 8888 is the API + control pages; chat lives in Open WebUI. llama.cpp's
        # built-in UI (off by default, toggle on /server) stays at /index.html.
        location = / {
            return 302 /server/;
        }

        location = /monitor {
            return 301 /monitor/;
        }

        location = /monitor/hw {
            proxy_pass http://127.0.0.1:8083/hw;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location /monitor/ {
            alias /opt/monitor/;
            index index.html;
            add_header Cache-Control "no-cache";
        }

        location = /server {
            return 301 /server/;
        }

        # Server manager (python/Server/manager.py): backend control, params, models.
        location /server/api/ {
            proxy_pass http://127.0.0.1:8090/api/;
            proxy_http_version 1.1;
            proxy_buffering off;
            # `vllm serve --help` (flag catalog) imports torch; give it time.
            proxy_read_timeout 300s;
            client_max_body_size 1m;
        }

        location /server/ {
            alias /opt/server/www/;
            index index.html;
            add_header Cache-Control "no-cache";
        }

        location / {
            proxy_pass http://llm;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Token streaming (SSE): pass bytes through as they arrive.
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
